<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/Mapa.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <title>Mapa de riesgo</title>
  </head>
  <body>
    <header>
      <section class="container">
        <div class="input-group mb-3 p-2 mt-2">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar zona o direccion"
            aria-label="Buscar zona o direccion"
            aria-describedby="button-addon2"
          />
          <button
            class="btn btn-outline-secondary"
            type="button"
            id="button-addon2"
          >
            <i class="bi bi-search"></i>
          </button>
        </div>
      </section>
    </header>

    <main>
      <section class="container">
        <div class="contenedor-mapa">
          <div id="map"></div>
        </div>

        <button class="rounded-5 btn text-white btn-reporte">
          <i class="bi bi-plus-lg"></i>
          Reportar
        </button>
        <button class="rounded-3 btn text-white btn-zoom">
          <i class="bi bi-arrows-angle-expand "></i>
        </button>
      </section>

      <section class="container mt-4 mb-5">
        <div class="mb-4">
          <div class="card-mapa card p-3">
            <h2 class="text-danger fs-5">
              Entrando a una zona peligrosa
              <i class="bi bi-exclamation-circle fs-5"></i>
            </h2>
            <p clas text-black>
              Zona norte - hace 20 min - tipo de peligro
              <i class="bi bi-circle-fill text-danger"></i>
            </p>
            <p class="container">
              Lorem ipsum dolor, sit amet consectetur adipisicing elit.
              Expedita, officiis. Eligendi dolorum blanditiis beatae aspernatur?
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
    <script src="../js/mapa.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- descargar axios y json -->
  </body>
</html>
